.g-av.xs{width:28px;height:28px;border-radius:9px;font-size:.8rem}
.g-av.xl{width:96px;height:96px;border-radius:28px;font-size:2.6rem;box-shadow:var(--shadow),inset 0 1px 0 rgb(255 255 255 / .4)}
.g-av.round{border-radius:50%}
.mchip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--panel2);font-weight:700;font-size:.86rem;min-height:36px}
.av-stack{display:flex;align-items:center;margin-top:8px}.av-stack .g-av{margin-right:-8px;box-shadow:0 0 0 2px var(--panel),var(--shadow-sm)}
.av-pick{display:grid;gap:14px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.av-opt{appearance:none;border:0;padding:0;background:none;display:grid;place-items:center;aspect-ratio:1;border-radius:14px;cursor:pointer}
.av-opt .g-av{width:100%;height:100%;border-radius:14px}
.av-opt.ic{background:var(--panel2);color:var(--ink)}.av-opt.ic svg{width:58%;height:58%}.av-opt.ic b{font-size:1.1rem}
.av-opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--teal)}
.av-prev{display:flex;align-items:center;gap:14px}
.av-pick .hint{text-transform:none;letter-spacing:normal;font-weight:500}
.badge-in.has-av{position:relative;background:var(--avbg);color:var(--avink)}
.badge-in.has-av svg{width:58%;height:58%}
.badge-lv{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:var(--g-black);color:var(--bar-ink);font-size:.58rem;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:999px;line-height:1.2;white-space:nowrap;box-shadow:var(--shadow-sm)}
@media (prefers-reduced-motion:no-preference){.av-opt{transition:transform .18s cubic-bezier(.2,1.6,.4,1)}.av-opt:active{transform:scale(.9)}.av-prev .g-av{animation:pop2 .45s cubic-bezier(.2,1.6,.4,1)}}
/* ---------- unit tests ---------- */
.test-gate{display:flex;align-items:center;gap:10px;margin:2px 0 10px;color:var(--muted);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.test-gate::before,.test-gate::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 70%,transparent),transparent)}
.test-card{display:grid;gap:12px;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,var(--panel));box-shadow:inset 0 0 0 1px var(--rule)}
.test-card.open{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--panel)),var(--panel) 70%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 70%,transparent),var(--shadow-sm)}
.test-card h3{margin:2px 0 0;font-size:1.1rem}
.test-top{display:flex;align-items:center;gap:12px}
.test-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;flex:none;background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.test-card.open .test-ic,.test-ic.big{background:var(--g-gold);color:#0F1113;box-shadow:var(--shadow-sm)}
.test-ic svg{width:60%;height:60%}.test-ic.big{width:72px;height:72px;border-radius:20px}
.test-st{font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);white-space:nowrap}
.test-st.ready{background:var(--g-go);color:#0F1113}.test-st.passed{background:var(--lv1);color:#0F1113}.test-st.gold{background:var(--g-gold);color:#0F1113}.test-st.overcap{background:var(--lv3);color:#0F1113}
.test-times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.test-times>div{background:var(--panel2);border-radius:12px;padding:8px 10px;display:grid}
.test-times span{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.test-times b{font-size:1.15rem}
.unit-row{display:flex;gap:6px;flex-wrap:wrap}
.unit-pip{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--muted)}
.unit-pip.on{background:var(--ub);color:#0F1113;box-shadow:var(--shadow-sm)}
.rep-count{margin-top:6px;font-weight:700;color:var(--muted)}.rep-count b{color:var(--ink);font-size:1.2rem}
.test-result{display:grid;gap:4px;text-align:center;padding:12px 16px;border-radius:14px;max-width:26rem;width:100%}
.test-result b{font-size:1.2rem;letter-spacing:.02em}
.test-result.gold{background:var(--g-gold);color:#0F1113}.test-result.pass{background:var(--g-go);color:#0F1113}.test-result.over{background:color-mix(in srgb,var(--lv3) 25%,var(--panel));color:var(--ink)}
.test-result .hint{color:inherit;opacity:.8}
@media (prefers-reduced-motion:no-preference){.test-card.open .test-ic{animation:glow 2.4s ease-in-out infinite}.test-result{animation:phasepop .6s cubic-bezier(.2,1.7,.4,1) .3s both}}
/* ---------- home ---------- */
.home-hero{display:grid;gap:12px;padding:18px;border-radius:var(--r);background:linear-gradient(150deg,color-mix(in srgb,var(--teal) 28%,var(--panel)),var(--panel) 70%);box-shadow:var(--shadow)}
.pick .test-ic,.list .test-ic{background:var(--g-gold);color:#0F1113;box-shadow:var(--shadow-sm)}
.hh-top{display:flex;align-items:center;gap:14px}.hh-top h2{margin:0;font-size:1.6rem}
.hh-lv{appearance:none;border:0;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--g-teal);color:var(--on-color);box-shadow:var(--shadow-sm);flex:none;line-height:1}
.hh-lv small{font-size:.5rem;font-weight:800;letter-spacing:.14em}.hh-lv b{font-size:1.4rem;font-weight:800}
.hh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hh-stats>div{display:grid;background:color-mix(in srgb,var(--panel) 75%,transparent);border-radius:12px;padding:8px 10px}
.hh-stats b{font-size:1.4rem;font-weight:800}.hh-stats span{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hh-done{font-weight:600;font-size:.9rem;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--lv1) 22%,var(--panel))}
.hh-done.warn{background:color-mix(in srgb,var(--lv3) 22%,var(--panel))}
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--rule)}
.pick.test{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--panel)),var(--panel) 70%);box-shadow:var(--shadow-sm),inset 0 0 0 2px color-mix(in srgb,var(--gold) 70%,transparent)}
.pick-main{appearance:none;border:0;background:none;padding:0;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;color:var(--ink);min-width:0;cursor:pointer}
.pick-main h3{margin:4px 0 2px;font-size:1.05rem}.pick-main .sub{font-size:.86rem;font-weight:600;color:var(--muted)}
.pick-meta{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}
.pick-tag{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--teal) 20%,var(--panel));color:var(--ink)}
.pick-tag.test{background:var(--g-gold);color:#0F1113}.pick-tag.unlock{background:var(--g-go);color:#0F1113}
.pick-go{min-height:46px;padding:0 16px}
@media (prefers-reduced-motion:no-preference){#view.anim .pick{animation:rise .5s cubic-bezier(.2,.9,.3,1.12) both}#view.anim .pick:nth-child(2){animation-delay:.08s}#view.anim .pick:nth-child(3){animation-delay:.16s}#view.anim .pick:nth-child(4){animation-delay:.24s}#view.anim .home-hero{animation:rise .55s cubic-bezier(.2,.9,.3,1.12) both}}
/* ---------- remote home ---------- */
.remote{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 104px - env(safe-area-inset-bottom,0px))}
.r-status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow-sm)}
.r-me{appearance:none;border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;color:var(--ink);cursor:pointer}
.r-me .g-av{width:44px;height:44px;font-size:1.1rem}
.r-who{display:grid;gap:3px;min-width:0;flex:1}.r-who b{font-size:1.05rem;line-height:1}.r-who small{font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-xp{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}.r-xp i{display:block;height:100%;border-radius:99px;background:var(--g-green);min-width:6px}
.r-chips{display:flex;gap:6px;flex:none}
.r-chip{display:grid;place-items:center;min-width:48px;padding:5px 6px;border-radius:12px;background:var(--panel2);font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.r-chip b{font-size:1.1rem;color:var(--ink);letter-spacing:0}.r-chip.on{background:color-mix(in srgb,var(--lv1) 25%,var(--panel))}.r-chip.warn{background:color-mix(in srgb,var(--lv3) 30%,var(--panel))}.r-chip.gold{background:var(--g-gold)}.r-chip.gold,.r-chip.gold b{color:#0F1113}
.r-note{font-size:.8rem;font-weight:700;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--lv3) 22%,var(--panel));margin-top:-2px}.r-note.ok{background:color-mix(in srgb,var(--lv1) 22%,var(--panel))}
.r-deck{display:grid;gap:12px;padding:12px 14px 14px;border-radius:24px;background:linear-gradient(170deg,color-mix(in srgb,var(--teal) 24%,var(--panel)),var(--panel) 75%);box-shadow:var(--shadow);flex:1;align-content:space-between;overflow:hidden}
.r-deck.test{background:linear-gradient(170deg,color-mix(in srgb,var(--gold) 30%,var(--panel)),var(--panel) 75%)}
.r-deck.unlock{background:linear-gradient(170deg,color-mix(in srgb,var(--lv1) 26%,var(--panel)),var(--panel) 75%)}
.r-dots{display:flex;gap:6px;justify-content:center}
.r-dot{appearance:none;border:0;border-radius:999px;padding:5px 10px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted);min-height:28px}
.r-dot.on{background:var(--ink);color:var(--panel)}.r-dot.on.test{background:var(--g-gold);color:#0F1113}.r-dot.on.unlock{background:var(--g-go);color:#0F1113}
.r-card{appearance:none;border:0;background:none;padding:0;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;color:var(--ink);cursor:pointer;min-height:96px}
.r-thumb{background:var(--g-gold);color:#0F1113;box-shadow:var(--shadow-sm)}
.r-card .wthumb,.r-thumb{width:76px;height:76px;border-radius:20px}.r-card .wthumb svg{width:46px;height:46px}.r-thumb svg{width:60%;height:60%}
.r-txt{display:grid;gap:4px;min-width:0}.r-txt h2{font-size:1.35rem;line-height:1.1}
.r-why{font-size:.88rem;font-weight:600;color:var(--muted);line-height:1.3}.r-meta{font-size:.78rem;font-weight:700;color:var(--muted)}
.r-pad{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;gap:8px}
.r-key{appearance:none;border:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--rule)}
.r-key svg{width:24px;height:24px}.r-key:disabled{opacity:.35}
.r-go{appearance:none;border:0;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;background:var(--g-teal);color:#0F1113;font-weight:900;font-size:.8rem;letter-spacing:.2em;padding:0;box-shadow:0 10px 28px -10px color-mix(in srgb,var(--teal) 80%,transparent),var(--shadow),inset 0 2px 0 rgb(255 255 255 / .45),inset 0 -6px 14px rgb(0 0 0 / .12)}
.r-go svg{width:44px;height:44px;margin-left:-3px}
.r-go.green{background:var(--g-go);box-shadow:0 10px 28px -10px color-mix(in srgb,var(--lv1) 85%,transparent),var(--shadow),inset 0 2px 0 rgb(255 255 255 / .45),inset 0 -6px 14px rgb(0 0 0 / .12)}
.r-go.gold{background:var(--g-gold);box-shadow:0 10px 28px -10px color-mix(in srgb,var(--gold) 85%,transparent),var(--shadow),inset 0 2px 0 rgb(255 255 255 / .45),inset 0 -6px 14px rgb(0 0 0 / .12)}
.r-sub{display:flex;justify-content:center;gap:10px}
.r-mini{appearance:none;border:0;display:inline-flex;align-items:center;gap:6px;padding:0 14px;min-height:38px;border-radius:999px;background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--ink);font-weight:800;font-size:.8rem;box-shadow:inset 0 0 0 1px var(--rule)}
.r-mini svg{width:16px;height:16px}
.r-keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-tile{appearance:none;border:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:12px;min-height:66px;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.r-tile .r-ic{grid-row:span 2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--g-teal);color:var(--on-color)}
.r-tile .r-ic svg{width:22px;height:22px}
.r-tile b{font-size:.92rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-tile small{font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (prefers-reduced-motion:no-preference){
  .r-go{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .r-go:active,.r-key:active,.r-tile:active,.r-mini:active,.r-dot:active{transform:scale(.92);animation:none}
  .r-go,.r-key,.r-tile,.r-mini,.r-dot{transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
  .r-card.slide{animation:cardslide .35s cubic-bezier(.2,1.1,.3,1)}
  @keyframes cardslide{from{opacity:0;transform:translateX(var(--dx))}}
  #view.anim .r-status,#view.anim .r-deck,#view.anim .r-tile{animation:rise .5s cubic-bezier(.2,.9,.3,1.12) both}
  #view.anim .r-deck{animation-delay:.06s}#view.anim .r-tile:nth-child(1){animation-delay:.14s}#view.anim .r-tile:nth-child(2){animation-delay:.18s}#view.anim .r-tile:nth-child(3){animation-delay:.22s}#view.anim .r-tile:nth-child(4){animation-delay:.26s}
}
/* compact phone layout: tighter header, bars and lists everywhere */
@media (max-width:640px){
  .wrap{padding-block:10px 100px}
  header.top{gap:10px;margin-bottom:10px}
  .badge{width:46px;height:46px;padding:3px}
  .badge-in{font-size:1rem}
  h1{font-size:1.5rem}
  #kickerLine{font-size:.62rem;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .stack{gap:12px}
  .pbody{padding:14px 14px}
  .bar{padding:8px 14px;font-size:.76rem}
  .item{padding:11px 14px;min-height:54px}
  nav.tabs{padding-top:6px}
  nav.tabs button{min-height:50px}
  body.home header.top{display:none}
  body.home .wrap{padding-top:12px}
}
@media (min-height:780px){.r-deck{align-content:space-evenly}.r-go{width:156px;height:156px;font-size:.9rem}.r-go svg{width:54px;height:54px;margin-left:-3px}.r-key{width:64px;height:64px}.r-card{grid-template-columns:1fr;justify-items:center;text-align:center;gap:12px}.r-card .wthumb,.r-thumb{width:96px;height:96px;border-radius:26px}.r-card .wthumb svg{width:58px;height:58px}.r-txt h2{font-size:1.6rem}.r-why{font-size:.95rem}}
@media (max-height:740px){.r-go{width:108px;height:108px}.r-go svg{width:36px;height:36px;margin-left:-3px}.r-key{width:50px;height:50px}.r-card{min-height:80px}.r-card .wthumb,.r-thumb{width:64px;height:64px}}
/* ---------- reward reel ---------- */
#reel{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));color:#F1F3F5;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 80% at 50% 35%,#163a44 0%,#0b1418 60%,#06090b 100%)}
#reel.s-level{background:radial-gradient(120% 80% at 50% 38%,#0f5a69 0%,#0a1c22 60%,#05080a 100%)}
#reel.s-badge.t-g{background:radial-gradient(120% 80% at 50% 38%,#6b4a08 0%,#1d1505 60%,#070503 100%)}
#reel.s-badge.t-s{background:radial-gradient(120% 80% at 50% 38%,#3b4752 0%,#12171b 60%,#06080a 100%)}
#reel.s-badge.t-b{background:radial-gradient(120% 80% at 50% 38%,#5a3115 0%,#1a0f07 60%,#070403 100%)}
#reel.s-unlock{background:radial-gradient(120% 80% at 50% 38%,#145a3a 0%,#0a1a12 60%,#050806 100%)}
.rl-body{position:relative;z-index:2;display:grid;justify-items:center;gap:14px;text-align:center;width:100%;max-width:26rem}
.rl-dots{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.rl-dots i{width:22px;height:4px;border-radius:4px;background:rgb(255 255 255 / .2)}.rl-dots i.done{background:rgb(255 255 255 / .6)}.rl-dots i.on{background:#fff}
.rl-skip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:3;appearance:none;border:0;background:rgb(255 255 255 / .12);color:#fff;font-weight:800;font-size:.8rem;padding:0 14px;min-height:36px;border-radius:999px}
.rl-kicker{font-weight:800;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:rgb(255 255 255 / .7)}
.rl-kicker.big{font-size:1rem;color:#fff;letter-spacing:.3em}
.rl-xp{display:flex;align-items:baseline;gap:6px;font-weight:900;line-height:1}
.rl-xp b{font-size:clamp(4.5rem,24vw,7rem);letter-spacing:-.04em;background:linear-gradient(180deg,#FFF6C8,#F2B630 60%,#E8A317);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgb(242 182 48 / .45))}
.rl-xp span{font-size:1.6rem;color:#F2B630}
.rl-lines{display:grid;gap:6px;width:100%}
.rl-line{display:flex;justify-content:space-between;padding:9px 14px;border-radius:12px;background:rgb(255 255 255 / .07);font-weight:700;font-size:.92rem}
.rl-line b{color:#FFE38A}
.rl-bar{width:100%;display:grid;gap:8px;margin-top:6px}
.rl-lv{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;color:rgb(255 255 255 / .8)}.rl-lv b{color:#fff;font-size:1.1rem}
.rl-track{height:16px;border-radius:99px;background:rgb(255 255 255 / .12);overflow:hidden;box-shadow:inset 0 1px 3px rgb(0 0 0 / .5)}
.rl-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#36B36B,#7ED957,#E2F78A);box-shadow:0 0 16px rgb(126 217 87 / .7);transition:width .9s cubic-bezier(.3,.8,.2,1);position:relative;overflow:hidden}
.rl-track i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255 / .6) 50%,transparent 70%);transform:translateX(-100%)}
.rl-track.flash{box-shadow:0 0 0 3px #FFE38A,0 0 30px #F2B630}
.rl-tap{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:rgb(255 255 255 / .55);opacity:0;transition:opacity .4s}
.rl-tap.on{opacity:1}
.rl-rays{position:absolute;left:50%;top:40%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);z-index:1;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgb(255 255 255 / .09) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#reel.s-badge.t-g .rl-rays{background:repeating-conic-gradient(from 0deg,rgb(255 214 102 / .18) 0 7deg,transparent 7deg 18deg);opacity:.8}
.rl-medal{display:grid;place-items:center}

.tset-link{appearance:none;border:0;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel2);color:var(--ink);font:inherit;font-weight:800;text-align:left;cursor:pointer}
.tset-link svg{width:22px;height:22px;color:var(--teal);grid-row:1/3}.tset-link small{grid-column:2;font-weight:600;font-size:.76rem;color:var(--muted)}
.tset-sec{display:grid;gap:12px}.tset-h{font-weight:900;font-size:1rem;padding-top:6px;border-top:1px solid var(--rule)}
.tset-row{display:grid;gap:6px}
.tseg button{font-size:.78rem;padding:0 4px;min-height:40px}
.tprev-wrap{border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
#tPrev.run{position:relative;inset:auto;z-index:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;min-height:0;height:auto;--bs2:.42}
#tPrev .run-big{font-size:calc(clamp(5.5rem,32vw,9.5rem)*var(--bs,1)*var(--bs2))}
#tPrev .run-ring{width:calc(min(74vw,320px)*var(--bs2)*1.25)}#tPrev .run-ring .run-big{font-size:calc(clamp(3.4rem,18vw,6rem)*var(--bs,1)*var(--bs2)*1.2)}
#tPrev .run-name{font-size:1.1rem}#tPrev .run-phase{font-size:.62rem;padding:4px 10px}#tPrev .run-unit{font-size:.62rem}#tPrev .run-prog{width:70%}
.run.ts-m{--bs:.72}.run.ts-l{--bs:1}.run.ts-xl{--bs:1.3}
.run .run-big{font-size:calc(clamp(5.5rem,32vw,9.5rem)*var(--bs,1))}
@media (max-height:700px){.run.ts-xl{--bs:1.12}}
.run-tl{display:flex;gap:8px;align-items:center}
.run-gear{appearance:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);cursor:pointer}.run-gear svg{width:20px;height:20px}
.run-ring{position:relative;width:min(74vw,320px,42dvh);aspect-ratio:1;display:grid;place-items:center}
.run-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.run-ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.rr-bg{stroke:color-mix(in srgb,var(--ink) 12%,transparent)}
.rr-fg{stroke:var(--phase,var(--teal));stroke-dasharray:100;transition:stroke-dashoffset .25s linear}
.run-ring .run-big{font-size:calc(clamp(3.4rem,18vw,6rem)*var(--bs,1))}
.run-prog{width:min(80vw,420px);height:14px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.run-prog i{display:block;height:100%;border-radius:99px;background:var(--phase,var(--teal));transition:width .25s linear}
.run.tt-dark{background:#0D0F11!important;background-image:none!important;--ink:#F1F3F5;--muted:#AEB6BD;--rule:#2A3036;--panel:#1B1F23;--panel2:#15181B;color:#F1F3F5}
.run.tt-bright{background:var(--phase)!important;background-image:none!important;--ink:#0F1113;--muted:rgb(15 17 19 / .72);color:#0F1113}

.run.tt-bright .rr-bg{stroke:rgb(15 17 19 / .18)}
.run.tt-mono{background-image:none!important;background:var(--bg)!important}

/* ===== calm layer: one quiet surface, fewer boxes, softer chrome ===== */
:root{--bg:#F2F4F5;--bg2:#F2F4F5;--panel:#FFFFFF;--panel2:#F5F7F8;--rule:#E5E9EC;--muted:#5B636A;
  --shadow:0 1px 2px rgb(15 17 19 / .05);--shadow-sm:0 1px 2px rgb(15 17 19 / .05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--bg2:#111316;--panel:#1A1E22;--panel2:#20252A;--rule:#2A3036;--muted:#A9B1B8;--shadow:none;--shadow-sm:none}}
:root[data-theme="dark"]{--bg:#111316;--bg2:#111316;--panel:#1A1E22;--panel2:#20252A;--rule:#2A3036;--muted:#A9B1B8;--shadow:none;--shadow-sm:none}
body,.sheet{background-image:none!important;background-color:var(--bg)!important}
.bar::before,.bar::after,.wthumb::after,.dbl-banner::after{display:none!important}
/* panels: flat cards with a hairline, headers become quiet labels */
.panel{background:var(--panel);border-radius:20px;box-shadow:0 0 0 1px var(--rule)}
.bar,.bar[class*=" b-"],.bar.teal,.bar.green,.bar.gold,.bar.orange,.bar.amber,.bar.aqua,.bar.black{background:none!important;color:var(--muted)!important;padding:16px 18px 0;font-size:.7rem;letter-spacing:.14em;font-weight:800}
.pbody{padding:14px 18px 18px}
.item{border-top-color:color-mix(in srgb,var(--rule) 70%,transparent);padding:13px 18px}
.list-div{background:none;border-top:0;padding:16px 18px 4px;font-size:.66rem}
.stat{background:var(--panel2);box-shadow:none;border-radius:14px}
/* header: just the title */
#kickerLine,.hdr-logo{display:none!important}
header.top{margin-bottom:14px}
header.top .badge{width:44px;height:44px}
h1{font-size:1.9rem;letter-spacing:-.02em}
/* chips & sort: lighter */
.chip{box-shadow:none;background:transparent;border:1px solid var(--rule);min-height:36px;padding:5px 13px;font-weight:700}
.chip[aria-pressed="true"],.sortbar .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortbar > span{display:none}
.pin{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
/* buttons: solid, no gloss */
.btn{box-shadow:none}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.add-link{appearance:none;border:0;background:none;color:var(--teal);font:inherit;font-weight:800;font-size:.9rem;padding:4px 2px;justify-self:end;cursor:pointer}
/* tags: text, not pills */
.item .tag{background:none!important;color:var(--muted)!important;padding:0;letter-spacing:.06em;font-size:.64rem}
/* bottom bar: icon tint instead of a block */
nav.tabs{box-shadow:0 -1px 0 var(--rule);background:color-mix(in srgb,var(--bg) 92%,transparent)}
nav.tabs button[aria-current="page"]{background:none;color:var(--teal);box-shadow:none}
nav.tabs button[aria-current="page"]::after{content:"";width:18px;height:3px;border-radius:3px;background:var(--teal);margin-top:2px}
nav.tabs .nav-home[aria-current="page"]::after{display:none}
nav.tabs button[aria-current="page"] .nav-mark .ca-badge{stroke:none}
nav.tabs .nav-home:not([aria-current="page"]) .nav-mark{opacity:.75;filter:grayscale(.4)}
/* home: let the card sit on the page */
.r-status{box-shadow:0 0 0 1px var(--rule)}
.r-deck{box-shadow:0 0 0 1px var(--rule);background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 10%,var(--panel)),var(--panel) 60%)}
.r-note{background:var(--panel2)}
/* tree head */
.climb-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.climb-row b{font-size:1.5rem}.climb-row span{color:var(--muted);font-weight:700;font-size:.85rem}
.mq-row{display:flex;gap:8px;align-items:stretch}.mq-row .search{flex:1;min-width:0}.mq-row .mview{flex:none;grid-auto-columns:44px;padding:3px}.mq-row .mview button{min-height:38px;font-size:1.05rem;padding:0}
.search{box-shadow:none;border:1px solid var(--rule)}

html.standalone.no-auth nav.tabs{grid-template-columns:repeat(4,1fr)}html.standalone.no-auth nav.tabs button[data-tab="groups"]{display:none}
html.standalone .wrap{padding-top:max(20px,calc(env(safe-area-inset-top) + 8px))}
html.standalone body.home .wrap{padding-top:max(12px,env(safe-area-inset-top))}
html.standalone body.home .remote{height:calc(100dvh - 112px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
html.standalone .run{padding-top:max(16px,env(safe-area-inset-top))}
html.standalone,html.standalone body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.acct-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel2)}.acct-row span{flex:1;min-width:0;display:grid}.acct-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct-row small{color:var(--muted);font-weight:600;font-size:.76rem}
</style>

ery wide, toes pointed slightly outward."},{"id":"crab-reach","adjusted":"Reach one hand across the body toward the opposite foot, rotating through the thoracic spine, then return.","breath":"Exhale as you reach and rotate, inhale returning to center.","category":"Animal Flow","focus":"Shoulders, thoracic spine, core stability","level":"Intermediate","name":"Crab Reach","order":18,"progression":"","start":"Start in the Crab Walk tabletop position, hips lifted, hands and feet grounded."},{"id":"crab-walk","adjusted":"Lift hips off the ground into a tabletop position and walk sideways or forward, keeping hips elevated.","breath":"Exhale as you lift the hips, breathe steadily while walking.","category":"Animal Flow","focus":"Triceps, shoulders, glutes, core","level":"Beginner","name":"Crab Walk","order":17,"progression":"","start":"Sit on the floor, hands behind hips fingers pointing toward feet, feet flat, knees bent."},{"id":"criss-cross","adjusted":"On one turn cross the arms at the waist to jump through the loop, then uncross on the next turn.","breath":"Steady breathing; exhale on each cross.","category":"Jump Rope","focus":"Coordination, shoulders, calves","level":"Intermediate","name":"Criss-Cross","order":213,"progression":"Coordination skill. Next: Double Under","start":"Basic bounce with a steady rope."},{"id":"crocodile-crawl","adjusted":"Crawl forward by bending one elbow and knee together on the same side, staying low and flat like a crocodile.","breath":"Steady controlled breathing, exhale on each reaching pull.","category":"Animal Flow","focus":"Core, shoulders, chest","level":"Intermediate","name":"Crocodile Crawl","order":28,"progression":"","start":"Start in a low plank, body close to the ground."},{"id":"curtsy-lunge","adjusted":"Step one leg diagonally behind and across the other leg, bending both knees to lower down, then push back to standing.","breath":"Inhale stepping back and down, exhale returning to standing.","category":"Lunge","focus":"Glutes, adductors, stabilizers","level":"Intermediate","name":"Curtsy Lunge","order":55,"progression":"Lateral-plane accessory branch, more advanced than Lateral Lunge","start":"Stand tall with feet hip-width apart."},{"id":"cycling-interval","adjusted":"Push hard with high cadence or added resistance for the interval, then spin easy to recover.","breath":"Fast deep breathing during the effort, slow it down in recovery.","category":"Cycling","focus":"VO2 max, power, legs","level":"Intermediate","name":"Cycling Interval","order":221,"progression":"Hard efforts on the bike. Next: Bike Hill Climb","start":"Rolling at an easy cadence, ready to accelerate."},{"id":"dead-bug","adjusted":"Slowly extend one arm overhead and the opposite leg straight out, keeping the lower back pressed to the floor, then return and switch sides.","breath":"Exhale as the arm and leg extend out, inhale returning to center.","category":"Core","focus":"Deep core, anti-extension control","level":"Beginner","name":"Dead Bug","order":76,"progression":"","start":"Lie on the back, arms reaching straight up and knees bent at 90 degrees above the hips."},{"id":"dead-hang","adjusted":"Hang still with shoulders gently engaged away from the ears, ribs down, legs together.","breath":"Slow steady breaths; relax the jaw and keep breathing through the grip burn.","category":"Pull-Up","focus":"Grip, lats, shoulder health","level":"Beginner","name":"Dead Hang","order":203,"progression":"First pulling skill. Next: Scapular Pull","start":"Grip a bar overhead with hands shoulder-width apart, feet off the floor, arms fully straight."},{"id":"decline-push-up","adjusted":"Bend the elbows to lower the chest toward the floor, then press back up to full extension.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Upper chest, shoulders, triceps (harder variation)","level":"Intermediate","name":"Decline Push-Up","order":33,"progression":"Next: Diamond Push-Up or Archer Push-Up","start":"Hands on the floor, feet elevated on a bench or step behind you, body in a straight line."},{"id":"diamond-push-up","adjusted":"Bend the elbows close to the body to lower the chest toward the hands, then press back up.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Triceps, inner chest","level":"Intermediate","name":"Diamond Push-Up","order":34,"progression":"Triceps-focused branch; next: Archer Push-Up","start":"Plank position with hands together under the chest, thumbs and index fingers forming a diamond shape."},{"id":"donkey-kick","adjusted":"Jump both feet up and kick them behind you into the air while hands stay planted, then land softly back to standing.","breath":"Exhale sharply on the kick, inhale as you reset.","category":"Animal Flow","focus":"Shoulders, core, coordination, power","level":"Intermediate","name":"Donkey Kick","order":22,"progression":"","start":"Start standing, hinge forward and place both hands on the floor."},{"id":"double-under","adjusted":"Jump a little higher and whip the wrists so the rope passes under the feet twice per jump.","breath":"Exhale on each jump; keep the jaw loose.","category":"Jump Rope","focus":"Power, calves, timing, heart rate","level":"Advanced","name":"Double Under","order":214,"progression":"Top rope skill","start":"Basic bounce, slightly higher jump, rope tight."},{"id":"downward-facing-dog","adjusted":"Lift hips up and back into an inverted V, straighten legs as much as comfortable, press heels toward floor, hands press firmly into mat.","breath":"Long exhale as you lift hips up; steady nasal breathing while holding.","category":"Yoga","focus":"Shoulders, hamstrings, calves, spine decompression","level":"Beginner","name":"Downward-Facing Dog","order":1,"progression":"","start":"Start on all fours, hands under shoulders, knees under hips."},{"id":"duck-walk","adjusted":"Walk forward while staying low in the squat position the entire time, taking small controlled steps.","breath":"Steady breathing, exhale on each step.","category":"Animal Flow","focus":"Quads, glutes, ankle and hip mobility","level":"Intermediate","name":"Duck Walk","order":24,"progression":"","start":"Start in a deep squat, chest up, heels flat on the floor."},{"id":"easy-run","adjusted":"Run at a pace you could hold a conversation at, short quick steps landing under the hips.","breath":"Easy rhythm, roughly in for three steps and out for two.","category":"Running","focus":"Aerobic engine, legs, endurance","level":"Beginner","name":"Easy Run","order":216,"progression":"Conversational running. Next: Tempo Run","start":"Upright posture, slight forward lean from the ankles, relaxed hands."},{"id":"easy-spin","adjusted":"Pedal at a light, smooth cadence (about 80–90 rpm) with easy resistance.","breath":"Relaxed conversational breathing.","category":"Cycling","focus":"Aerobic base, legs, active recovery","level":"Beginner","name":"Easy Spin","order":219,"progression":"Cycling base. Next: Steady Ride","start":"Seat height set so the knee is slightly bent at the bottom of the pedal stroke, hands relaxed on the bars."},{"id":"forward-lunge","adjusted":"Step forward with one leg and bend both knees to roughly 90 degrees, then push back through the front heel to return to standing.","breath":"Inhale stepping into the lunge, exhale pushing back to standing.","category":"Lunge","focus":"Quads, glutes, hamstrings","level":"Beginner","name":"Forward Lunge","order":51,"progression":"Next: Walking Lunge","start":"Stand tall with feet hip-width apart."},{"id":"freestanding-handstand","adjusted":"Balance the body in a tight hollow line, making small finger and wrist adjustments to stay centered over the hands.","breath":"Steady even breathing throughout the hold, avoid holding the breath while balancing.","category":"Handstand","focus":"Shoulders, core, full-body balance and proprioception","level":"Advanced","name":"Freestanding Handstand","order":95,"progression":"Next: Wall Handstand Push-Up","start":"Kick up to an inverted position away from any wall, hands shoulder-width apart, fingers spread and gripping the floor."},{"id":"frog-jump","adjusted":"Explode forward with both feet, landing softly back in the squat with hands touching down first.","breath":"Exhale sharply on the jump, inhale as you reset in the squat.","category":"Animal Flow","focus":"Quads, glutes, explosive power","level":"Intermediate","name":"Frog Jump","order":20,"progression":"","start":"Start in a deep squat, hands planted on the floor between the knees."},{"id":"frog-position","adjusted":"Bend the knees and hips deeply, lowering the hips between the arms while keeping hands and feet planted.","breath":"Slow controlled breathing, exhale as you sink lower into the position.","category":"Animal Flow","focus":"Hips, groin mobility, ankles","level":"Beginner","name":"Frog Position","order":19,"progression":"","start":"Start on all fours, hands and feet flat on the floor, feet turned slightly out."},{"id":"full-l-sit","adjusted":"Lift both legs straight out in front, parallel to the floor, forming a full L shape with the torso, holding the position.","breath":"Steady controlled breathing, avoid holding the breath under the core tension.","category":"L-Sit Progression","focus":"Core, hip flexors, quads, triceps","level":"Advanced","name":"Full L-Sit","order":71,"progression":"Next: V-Sit","start":"Support the body on hands beside the hips, arms fully extended."},{"id":"glute-bridge","adjusted":"Drive through the heels to lift the hips until knees, hips and shoulders line up, squeeze the glutes, then lower with control.","breath":"Exhale as you lift, inhale as you lower.","category":"Squat","focus":"Glutes, hamstrings, lower back","level":"Beginner","name":"Glute Bridge","order":201,"progression":"Foundation hinge strength. Next: Bridge Pose holds and single-leg bridges","start":"Lie on your back, knees bent, feet flat and hip-width apart, arms by your sides."},{"id":"handstand-push-up","adjusted":"Bend the elbows to lower the head toward the floor, then press back up to full extension while maintaining balance.","breath":"Inhale lowering down, exhale pressing up.","category":"Handstand","focus":"Shoulders, triceps, core, full-body balance and strength","level":"Advanced","name":"Handstand Push-Up","order":97,"progression":"Top of the handstand progression","start":"Balance in a freestanding handstand, arms fully extended, body in a tight line."},{"id":"hanging-knee-raise","adjusted":"Raise the knees up toward the chest by curling the pelvis, then lower back down with control.","breath":"Exhale raising the knees, inhale lowering down.","category":"Core","focus":"Lower abs, hip flexors, grip","level":"Intermediate","name":"Hanging Knee Raise","order":77,"progression":"","start":"Hang from a bar with arms fully extended, legs hanging straight down."},{"id":"high-knee-rope","adjusted":"Drive each knee up to hip height on every turn while staying tall and quick.","breath":"Short quick breaths; keep the shoulders relaxed.","category":"Jump Rope","focus":"Hip flexors, calves, heart rate","level":"Intermediate","name":"High-Knee Rope","order":212,"progression":"Higher-intensity footwork. Next: Criss-Cross","start":"Alternate foot step rhythm with the rope turning faster."},{"id":"hill-run","adjusted":"Run up with short powerful strides and a strong arm drive, then walk or jog down to recover.","breath":"Strong exhales on the climb.","category":"Running","focus":"Glutes, calves, power endurance","level":"Intermediate","name":"Hill Run","order":218,"progression":"Strength on the move. Next: Hill Sprint","start":"Face a moderate hill, run tall with a slight forward lean."},{"id":"hill-sprint","adjusted":"Sprint up the hill at full effort with short powerful steps, then walk down to recover fully.","breath":"Forceful exhales; recover your breathing fully on the walk down.","category":"Sprinting","focus":"Power, glutes, calves, acceleration","level":"Advanced","name":"Hill Sprint","order":226,"progression":"Maximum effort uphill","start":"Base of a steep hill, forward lean, strong arm position."},{"id":"hold-knee-out","adjusted":"Hold the knee pressed out to its end range statically without pulsing, staying relaxed in the hips.","breath":"Steady even breathing throughout the hold, exhale to sink deeper if it feels available.","category":"Squat Mobility (Ido Portal)","focus":"Hip adductors, groin, static mobility","level":"Beginner","name":"Hold Knee Out","order":85,"progression":"Step 2 of 7 in the Ido Portal Squat Routine 2.0. Next: Sky Reaches","start":"Sit in a deep squat, elbow hooked against the inside of the knee, having just pressed the knee to its end range."},{"id":"hollow-body-hold","adjusted":"Lift the shoulders and legs slightly off the floor, pressing the lower back into the ground, forming a slight banana shape.","breath":"Steady controlled breathing, exhale to deepen the core brace if the lower back arches.","category":"Core","focus":"Deep core, hip flexors","level":"Beginner","name":"Hollow Body Hold","order":75,"progression":"","start":"Lie on the back, arms extended overhead and legs extended straight."},{"id":"horse-stance","adjusted":"Step the feet out to roughly twice shoulder width, toes pointing forward, bend the knees to sink the hips down until the thighs approach parallel to the floor, tailbone tucked slightly, chest tall, hands resting at the sides or held in front of the chest.","breath":"Steady slow breathing throughout the hold, breathing into the belly rather than holding the breath.","category":"Stance","focus":"Quads, glutes, adductors, isometric leg endurance","level":"Intermediate","name":"Horse Stance","order":91,"progression":"Isometric strength/endurance hold; deepen over time by lowering the hips closer to parallel","start":"Stand tall with feet together."},{"id":"inch-worm","adjusted":"Fold forward, walk the hands out to a plank, then walk the feet up to meet the hands, repeating the cycle.","breath":"Exhale folding down, steady breaths walking out, exhale walking feet back in.","category":"Animal Flow","focus":"Hamstrings, shoulders, core","level":"Beginner","name":"Inch Worm","order":26,"progression":"","start":"Stand tall, feet hip-width apart."},{"id":"incline-push-up","adjusted":"Bend the elbows to lower the chest toward the raised surface, then press back up.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Lower chest, shoulders, triceps (easier variation)","level":"Beginner","name":"Incline Push-Up","order":32,"progression":"Next: Standard Push-Up","start":"Hands placed on an elevated surface like a bench or step, body straight, feet on the floor behind."},{"id":"jump-squat","adjusted":"Squat down and explode upward into a jump, landing softly back into the squat position.","breath":"Exhale on the jump, inhale absorbing the landing.","category":"Squat","focus":"Quads, glutes, calves, explosive power","level":"Intermediate","name":"Jump Squat","order":44,"progression":"Power accessory branch off Air Squat","start":"Stand with feet shoulder-width apart in an athletic stance."},{"id":"jumping-lunge","adjusted":"Jump explosively and switch the legs in the air, landing softly in the opposite lunge.","breath":"Exhale on the jump, inhale absorbing the landing.","category":"Lunge","focus":"Quads, glutes, explosive power, coordination","level":"Intermediate","name":"Jumping Lunge","order":56,"progression":"Top of the lunge progression (power)","start":"Start in a lunge position, one foot forward and one foot back."},{"id":"kangaroo-jump","adjusted":"Bend the knees and jump forward explosively, landing softly with knees bent to absorb impact.","breath":"Exhale on the jump, inhale on the landing reset.","category":"Animal Flow","focus":"Quads, glutes, calves, explosive power","level":"Intermediate","name":"Kangaroo Jump","order":25,"progression":"","start":"Start standing with feet hip-width apart, arms relaxed at the sides like small paws."},{"id":"knee-push-up","adjusted":"Bend the elbows to lower the chest toward the floor, then press back up to the start.","breath":"Inhale on the way down, exhale pressing back up.","category":"Push-Up","focus":"Chest, shoulders, triceps (reduced load)","level":"Beginner","name":"Knee Push-Up","order":30,"progression":"Beginner start. Next: Incline Push-Up","start":"Kneel on the floor, hands planted slightly wider than shoulders, knees as the pivot point, body straight from knees to head."},{"id":"korean-dip","adjusted":"Lower the body down and slightly forward so the chest passes below hand level and shoulders stretch deeply, then press back up.","breath":"Inhale lowering down, exhale pressing up.","category":"Dip","focus":"Chest, front shoulders, deep stretch","level":"Advanced","name":"Korean Dip","order":60,"progression":"Top of the dip progression","start":"Support the body on parallel bars or rings with arms extended, torso angled slightly forward."},{"id":"l-sit-pull-up","adjusted":"Pull the body up while maintaining the L-sit leg position throughout, then lower back down with control.","breath":"Exhale pulling up, inhale lowering down, keep breathing despite the core tension.","category":"Pull-Up","focus":"Lats, biceps, core compression","level":"Advanced","name":"L-Sit Pull-Up","order":67,"progression":"Next: Typewriter Pull-Up","start":"Hang from a bar with legs extended straight out in front at hip height, forming an L shape."},{"id":"lateral-lunge","adjusted":"Step one leg out wide to the side and bend that knee while keeping the other leg straight, hips sitting back, then push off to return to center.","breath":"Inhale stepping out and sitting into the lunge, exhale returning to center.","category":"Lunge","focus":"Adductors, glutes, quads, hip mobility","level":"Beginner","name":"Lateral Lunge","order":54,"progression":"Lateral-plane accessory branch","start":"Stand with feet together, hands at chest or hips."},{"id":"leopard-crawl","adjusted":"Crawl forward keeping the torso low and parallel to the floor, opposite hand and foot moving together.","breath":"Steady breathing through the nose, exhale on each reaching stride.","category":"Animal Flow","focus":"Shoulders, core, hip mobility","level":"Intermediate","name":"Leopard Crawl","order":16,"progression":"","start":"Start low on hands and feet, body close to the ground, hips dropped almost level with shoulders."},{"id":"mountain-climber","adjusted":"Drive one knee toward the chest, then switch legs quickly, keeping hips level and shoulders over hands.","breath":"Short rhythmic breaths, one breath every two strides.","category":"Conditioning","focus":"Core, shoulders, hip flexors, heart rate","level":"Beginner","name":"Mountain Climber","order":208,"progression":"Core-driven conditioning. Next: Burpee","start":"High plank, hands under shoulders, body straight."},{"id":"mountain-pose","adjusted":"Lift through the crown of the head, roll shoulders back and down, engage thighs, tuck pelvis to neutral.","breath":"Slow steady breaths through the nose, lengthen spine on each inhale.","category":"Yoga","focus":"Posture, full-body alignment, quiet core engagement","level":"Beginner","name":"Mountain Pose","order":0,"progression":"","start":"Stand tall, feet hip-width apart, weight even across all four corners of both feet, arms relaxed at sides."},{"id":"muscle-up","adjusted":"Pull explosively toward the hips, lean the chest over the bar as the elbows pass it, then press out to a straight-bar support.","breath":"Big breath before the pull, exhale hard through the transition.","category":"Pull-Up","focus":"Lats, chest, triceps, explosive pulling","level":"Advanced","name":"Muscle-Up","order":209,"progression":"Top of the pulling ladder. Builds from Typewriter Pull-Up and Straight Bar Dip","start":"Hang from a bar with a false or overhand grip, body hollow."},{"id":"negative-pull-up","adjusted":"Lower yourself as slowly as possible to a straight-arm hang, then step back up and repeat.","breath":"Breathe out slowly through the whole descent.","category":"Pull-Up","focus":"Lats, biceps, eccentric strength","level":"Intermediate","name":"Negative Pull-Up","order":206,"progression":"Builds strength for the first full pull-up. Next: Chin-Up","start":"Jump or step up so your chin is above the bar, elbows bent, body tight."},{"id":"one-arm-push-up","adjusted":"Bend the working elbow to lower the chest toward the floor while resisting rotation, then press back up.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Chest, triceps, core anti-rotation","level":"Advanced","name":"One-Arm Push-Up","order":38,"progression":"Top of the push-up progression","start":"Plank position balanced on one hand placed under the shoulder, feet spread wide for stability, other arm behind the back."},{"id":"parallel-bar-dip","adjusted":"Bend the elbows to lower the body down until the shoulders are near the level of the elbows, then press back up to full extension.","breath":"Inhale lowering down, exhale pressing up.","category":"Dip","focus":"Chest, triceps, shoulders","level":"Intermediate","name":"Parallel Bar Dip","order":58,"progression":"Next: Straight Bar Dip","start":"Support the body on parallel bars with arms fully extended, shoulders over hands, legs hanging or crossed."},{"id":"parallette-push-up","adjusted":"Bend the elbows close to the ribs and lower the chest below the level of the handles for a full deficit stretch, then press back up to locked arms.","breath":"Inhale as you lower into the deficit, exhale as you press back up.","category":"Push-Up","focus":"Chest (deep stretch), shoulders, triceps, wrist-friendly pressing","level":"Intermediate","name":"Parallette Push-Up","order":31.5,"progression":"Deficit variation of Standard Push-Up; adds range below hand level. Next: Pseudo Planche Push-Up (on parallettes) or Archer Push-Up","start":"Plank position with hands gripping parallettes set shoulder-width apart, wrists neutral, arms locked, body in a straight line from head to heels."},{"id":"pigeon-pose","adjusted":"Square the hips forward and fold the torso down over the front shin, or stay upright with tall spine.","breath":"Slow, deep breaths to release tension in the hip with each exhale.","category":"Yoga","focus":"Hip external rotators, glutes","level":"Beginner","name":"Pigeon Pose","order":11,"progression":"","start":"Start on all fours, then bring one knee forward behind the wrist, shin angled across the mat, back leg extended straight behind."},{"id":"pike-push-up","adjusted":"Bend the elbows to lower the head toward the floor just in front of the hands, then press back up to the inverted V.","breath":"Inhale lowering down, exhale pressing back up.","category":"Handstand","focus":"Shoulders, triceps, upper chest (vertical pressing strength)","level":"Intermediate","name":"Pike Push-Up","order":92,"progression":"Foundational strength builder; next: Wall Handstand Hold","start":"Start in a downward-dog-like position, hands under shoulders, hips lifted high, body forming an inverted V."},{"id":"pistol-squat","adjusted":"Bend the standing knee to lower into a full single-leg squat, keeping the extended leg off the floor, then press back up.","breath":"Inhale lowering down, exhale pressing up.","category":"Squat","focus":"Quads, glutes, balance, ankle mobility","level":"Advanced","name":"Pistol Squat","order":47,"progression":"Top of the single-leg squat progression","start":"Stand on one leg, the other leg extended straight out in front, arms reaching forward for balance."},{"id":"plank","adjusted":"Hold the straight-line position, bracing the core and squeezing the glutes to prevent the hips from sagging or piking.","breath":"Steady even breathing throughout, never holding the breath.","category":"Core","focus":"Core, shoulders, glutes (isometric)","level":"Beginner","name":"Plank","order":74,"progression":"","start":"Support the body on forearms or hands and toes, body forming a straight line from head to heels."},{"id":"pseudo-planche-push-up","adjusted":"Bend the elbows to lower the chest toward the hands while keeping shoulders tipped forward, then press back up.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Shoulders, chest, straight-arm strength (planche prep)","level":"Advanced","name":"Pseudo Planche Push-Up","order":37,"progression":"Next: One-Arm Push-Up (straight-arm strength track)","start":"Plank position with hands placed low near the waistline, fingers pointing slightly inward, shoulders pushed forward past the hands."},{"id":"reverse-lunge","adjusted":"Step one leg backward and bend both knees to lower the back knee toward the floor, then drive through the front heel to return to standing.","breath":"Inhale stepping back, exhale returning to standing.","category":"Lunge","focus":"Glutes, quads, balance","level":"Beginner","name":"Reverse Lunge","order":52,"progression":"Easier entry point; next: Forward Lunge","start":"Stand tall with feet hip-width apart."},{"id":"ring-dip","adjusted":"Bend the elbows to lower the body down while controlling the rings from turning inward, then press back up to full extension.","breath":"Inhale lowering down, exhale pressing up.","category":"Dip","focus":"Chest, triceps, shoulders, stabilizers","level":"Advanced","name":"Ring Dip","order":59,"progression":"Next: Korean Dip","start":"Support the body on gymnastic rings with arms extended and rings turned out slightly, core braced."},{"id":"scapular-pull","adjusted":"Without bending the elbows, pull the shoulder blades down and back to lift the body a few inches, then lower.","breath":"Exhale as the shoulders pull down, inhale as you return to the hang.","category":"Pull-Up","focus":"Lower traps, lats, shoulder stability","level":"Beginner","name":"Scapular Pull","order":204,"progression":"Teaches the start of every pull-up. Next: Australian Row","start":"Hang from a bar with straight arms, shoulders relaxed up toward the ears."},{"id":"scorpion-reach","adjusted":"Lift one leg and rotate it across the body to tap the floor near the opposite hand, then return.","breath":"Exhale as you rotate and reach, inhale returning to center.","category":"Animal Flow","focus":"Spine mobility, glutes, obliques","level":"Intermediate","name":"Scorpion Reach","order":27,"progression":"","start":"Lie face down, arms extended out to the sides at shoulder height."},{"id":"seated-forward-fold","adjusted":"Hinge forward from the hips, reaching hands toward feet or shins, keeping the back as straight as flexibility allows.","breath":"Exhale as you fold forward; breathe steadily as you hold and ease deeper.","category":"Yoga","focus":"Hamstrings, lower back, calves","level":"Beginner","name":"Seated Forward Fold","order":10,"progression":"","start":"Sit with legs extended straight in front, spine tall."},{"id":"shuttle-run","adjusted":"Sprint to the far marker, touch down, turn and sprint back, repeating for the interval.","breath":"Quick exhales at each turn.","category":"Sprinting","focus":"Acceleration, agility, legs","level":"Intermediate","name":"Shuttle Run","order":224,"progression":"Change-of-direction speed. Next: Sprint","start":"Two markers about 10 m apart, athletic stance at one."},{"id":"single-leg-l-sit","adjusted":"Hold the extended leg parallel to the floor while keeping the hips lifted, then switch legs.","breath":"Steady breathing throughout, exhale slightly to reset core tension if it fades.","category":"L-Sit Progression","focus":"Core, hip flexors, quads","level":"Intermediate","name":"Single-Leg L-Sit","order":70,"progression":"Next: Full L-Sit","start":"Support the body on hands beside the hips, one leg extended straight out, the other leg tucked toward the chest."},{"id":"sissy-squat","adjusted":"Lean the torso back while bending the knees forward, lowering the hips toward the heels in a straight line from knees to head, then return to standing.","breath":"Inhale lowering back, exhale returning to standing.","category":"Squat","focus":"Quads (deep isolation)","level":"Advanced","name":"Sissy Squat","order":48,"progression":"Quad-isolation accessory branch off Air Squat","start":"Stand tall holding onto something stable for balance, heels lifted slightly."},{"id":"sky-reaches","adjusted":"Rotate the torso and reach the opposite arm straight up toward the ceiling, following the hand with the eyes, then return and repeat.","breath":"Exhale as you rotate and reach up, inhale returning to center.","category":"Squat Mobility (Ido Portal)","focus":"Thoracic spine rotation, shoulders, hip mobility","level":"Beginner","name":"Sky Reaches","order":86,"progression":"Step 3 of 7 in the Ido Portal Squat Routine 2.0. Next: Static Pause (Sky Reach Hold)","start":"Sit in a deep squat, one hand planted on the floor for support, torso facing forward."},{"id":"slow-push-up","adjusted":"Lower the chest toward the floor over a slow count (3-5 seconds), pause briefly just above the floor, then press back up with control at the same slow tempo.","breath":"Inhale slowly through the entire descent, exhale slowly through the entire press up.","category":"Push-Up","focus":"Chest, shoulders, triceps, time-under-tension strength","level":"Intermediate","name":"Slow Push-Up","order":78,"progression":"Tempo variation of Standard Push-Up; build time-under-tension before advancing to Decline Push-Up","start":"Plank position, hands slightly wider than shoulders, body in a straight line from head to heels."},{"id":"split-squat","adjusted":"Bend both knees to lower the back knee toward the floor, then press back up through the front heel.","breath":"Inhale lowering down, exhale pressing up.","category":"Squat","focus":"Quads, glutes, unilateral stability","level":"Beginner","name":"Split Squat","order":45,"progression":"Next: Bulgarian Split Squat","start":"Stand in a staggered stance, one foot forward and one foot back, both feet flat on the floor."},{"id":"sprint","adjusted":"Accelerate to full speed with powerful arm drive and high knees, hold it for the interval, then walk back.","breath":"Big breath before, short powerful exhales during.","category":"Sprinting","focus":"Top speed, power, fast-twitch fibers","level":"Advanced","name":"Sprint","order":225,"progression":"All-out speed. Next: Hill Sprint","start":"Staggered stance, slight forward lean, arms ready."},{"id":"squat-bow-pause","adjusted":"Hold the forward-bowed position statically, relaxing the neck and upper back into the stretch.","breath":"Steady even breathing throughout the hold, favoring longer exhales to relax deeper.","category":"Squat Mobility (Ido Portal)","focus":"Spine, upper back, hips (restorative)","level":"Beginner","name":"Squat Bow Pause","order":90,"progression":"Step 7 of 7 in the Ido Portal Squat Routine 2.0 - final position","start":"Sit in a deep squat, torso bowed forward and down between the knees from the Squat Bow."},{"id":"squat-bows","adjusted":"Round the spine and bow the torso forward and down between the knees, then rise back up to the start for reps.","breath":"Exhale bowing forward and down, inhale rising back up.","category":"Squat Mobility (Ido Portal)","focus":"Spine flexion, hips, upper back stretch","level":"Beginner","name":"Squat Bows","order":89,"progression":"Step 6 of 7 in the Ido Portal Squat Routine 2.0. Next: Squat Bow Pause","start":"Sit in a deep squat, hands in loose fists or thumbs up near the chest."},{"id":"squat-knee-push","adjusted":"Press the knee outward against the elbow while the arm resists back inward, pulsing the knee out and in for reps.","breath":"Exhale as you press the knee out, inhale as you let it return.","category":"Squat Mobility (Ido Portal)","focus":"Hip adductors, groin, ankle mobility","level":"Beginner","name":"Squat Knee Push","order":84,"progression":"Step 1 of 7 in the Ido Portal Squat Routine 2.0. Next: Hold Knee Out","start":"Sit in a deep squat, feet flat and roughly shoulder-width apart, one elbow hooked against the inside of the same-side knee."},{"id":"standard-pull-up","adjusted":"Pull the body up until the chin clears the bar, then lower back down with control to a full hang.","breath":"Exhale pulling up, inhale lowering down.","category":"Pull-Up","focus":"Lats, biceps, upper back","level":"Intermediate","name":"Standard Pull-Up","order":62,"progression":"Next: Wide-Grip Pull-Up","start":"Hang from a bar with an overhand grip, hands shoulder-width apart, arms fully extended."},{"id":"standard-push-up","adjusted":"Bend the elbows to lower the chest to just above the floor, then press back up to full arm extension.","breath":"Inhale lowering down, exhale pressing up.","category":"Push-Up","focus":"Chest, shoulders, triceps, core","level":"Beginner","name":"Standard Push-Up","order":31,"progression":"Next: Decline Push-Up, or add tempo with Slow Push-Up","start":"Plank position, hands slightly wider than shoulders, body in a straight line from head to heels."},{"id":"standing-forward-fold","adjusted":"Hinge at the hips and fold the torso down over the legs, letting the head and arms hang, knees soft.","breath":"Exhale to fold down, breathe fully in the hold, letting the spine lengthen.","category":"Yoga","focus":"Hamstrings, lower back, calves","level":"Beginner","name":"Standing Forward Fold","order":12,"progression":"","start":"Stand tall in Mountain Pose, feet hip-width apart."},{"id":"static-pause-sky-reach-hold","adjusted":"Hold the rotated position with the arm reaching up, staying still and letting the stretch settle.","breath":"Steady even breathing throughout the hold.","category":"Squat Mobility (Ido Portal)","focus":"Thoracic spine, shoulders, static rotational mobility","level":"Beginner","name":"Static Pause (Sky Reach Hold)","order":87,"progression":"Step 4 of 7 in the Ido Portal Squat Routine 2.0. Next: Buddha Prayers","start":"Sit in a deep squat, torso rotated with one arm reaching straight up from the Sky Reach."},{"id":"steady-ride","adjusted":"Hold a moderate steady effort, slightly harder than easy, smooth circular pedal strokes.","breath":"Steady rhythmic breathing; you can still speak in short sentences.","category":"Cycling","focus":"Aerobic endurance, quads, glutes","level":"Beginner","name":"Steady Ride","order":220,"progression":"Endurance riding. Next: Cycling Interval","start":"Comfortable riding position, core lightly braced."},{"id":"straight-bar-dip","adjusted":"Bend the elbows to lower the body down in front of or behind the bar, then press back up to full extension.","breath":"Inhale lowering down, exhale pressing up.","category":"Dip","focus":"Chest, triceps, shoulders (advanced)","level":"Advanced","name":"Straight Bar Dip","order":61,"progression":"Next: Ring Dip","start":"Support the body on a single straight bar with arms extended and hands gripping the bar."},{"id":"strides","adjusted":"Build smoothly to about 85% of top speed over the stride, staying relaxed, then ease off.","breath":"Let breathing be natural; don't hold it.","category":"Sprinting","focus":"Running form, speed, leg stiffness","level":"Intermediate","name":"Strides","order":223,"progression":"Fast, relaxed running. Next: Sprint","start":"After a warm-up, start from a relaxed jog."},{"id":"superman-push-up","adjusted":"Explosively push off the ground so the hands and feet leave the floor simultaneously, arms reaching forward like flying, then land back in plank and lower into a push-up.","breath":"Exhale sharply on the explosive push, inhale on the landing.","category":"Push-Up","focus":"Chest, shoulders, explosive power","level":"Advanced","name":"Superman Push-Up","order":42,"progression":"Advanced power variation, top of the explosive push-up track","start":"Start in plank with hands set slightly forward of the shoulders."},{"id":"support-hold","adjusted":"Hold the body suspended above the ground with legs together underneath, maintaining locked-out arms.","breath":"Steady even breathing, keep breath flowing despite shoulder and core tension.","category":"L-Sit Progression","focus":"Shoulders, triceps, core (foundation hold)","level":"Intermediate","name":"Support Hold","order":73,"progression":"Foundational hold; next: Tuck Sit","start":"Support the body on parallettes or the floor, arms fully extended, shoulders depressed away from the ears."},{"id":"tempo-run","adjusted":"Lift to a comfortably hard pace you could hold for about 20 minutes, speaking only a few words at a time.","breath":"Deeper rhythmic breaths, in for two steps and out for two.","category":"Running","focus":"Lactate threshold, endurance","level":"Intermediate","name":"Tempo Run","order":217,"progression":"Comfortably hard running. Next: Hill Run","start":"Settle in from an easy run, posture tall."},{"id":"tibetan-rite-1-the-spin","adjusted":"Spin the body in a clockwise direction on the spot, eyes open and gently focused toward the ground, stopping if dizziness sets in.","breath":"Breathe naturally and rhythmically throughout the spin, never holding the breath.","category":"Tibetan Rite","focus":"Vestibular/balance system, core stabilizers, whole-body coordination","level":"Beginner","name":"Tibetan Rite 1 - The Spin","order":79,"progression":"","start":"Stand straight with feet shoulder-width apart, arms outstretched to the sides at shoulder height, palms facing down."},{"id":"tibetan-rite-2-the-leg-raise","adjusted":"Lift the head and tuck the chin to the chest while simultaneously raising both legs straight up toward the ceiling, then lower both together with control back to the floor.","breath":"Inhale lifting the head and legs, exhale lowering back down.","category":"Tibetan Rite","focus":"Abdominals, hip flexors, neck flexors","level":"Beginner","name":"Tibetan Rite 2 - The Leg Raise","order":80,"progression":"","start":"Lie flat on the back, arms at the sides, palms pressed down against the floor, legs extended straight."},{"id":"tibetan-rite-3-the-kneeling-backbend","adjusted":"Drop the chin to the chest and round forward slightly, then arch the spine backward, sliding the hands up the thighs and letting the head drop gently back.","breath":"Exhale rounding forward, inhale arching back and opening the chest.","category":"Tibetan Rite","focus":"Spine extensors, chest, hip flexors, neck","level":"Beginner","name":"Tibetan Rite 3 - The Kneeling Backbend","order":81,"progression":"","start":"Kneel upright with toes tucked under, hands placed on the back of the thighs, torso tall."},{"id":"tibetan-rite-4-the-table","adjusted":"Press through the hands and feet to lift the hips up into a tabletop position, knees bending to 90 degrees, torso parallel to the thighs, and let the head drop gently back.","breath":"Inhale lifting into the tabletop, exhale lowering back to the seated start.","category":"Tibetan Rite","focus":"Glutes, hamstrings, triceps, shoulders, core","level":"Beginner","name":"Tibetan Rite 4 - The Table","order":82,"progression":"","start":"Sit on the floor with legs extended straight out in front, hands planted flat on the floor beside the hips, chin dropped to the chest."},{"id":"tibetan-rite-5-the-dog-flow","adjusted":"Push the hips up and back into Downward-Facing Dog, forming an inverted V, then flow back down into the Upward Dog start, keeping the arms extended throughout.","breath":"Exhale pushing the hips up into Downward Dog, inhale flowing back down into Upward Dog.","category":"Tibetan Rite","focus":"Shoulders, chest, core, hamstrings, full-body flow","level":"Beginner","name":"Tibetan Rite 5 - The Dog Flow","order":83,"progression":"","start":"Start face down in an Upward-Dog-like position, toes curled under, arms extended, chest open, thighs hovering just off the floor."},{"id":"tiger-bend-push-up","adjusted":"Push up onto the hands one at a time to a full push-up position, then reverse back down to forearms.","breath":"Exhale pressing up to hands, inhale returning to forearms.","category":"Push-Up","focus":"Triceps, shoulders, straight-arm strength","level":"Advanced","name":"Tiger Bend Push-Up","order":40,"progression":"Advanced skill variation building straight-arm strength for planche work","start":"Start in a forearm plank with forearms on the floor."},{"id":"tree-pose","adjusted":"Place the sole of the other foot on the inner calf or thigh (never the knee), hands at heart center or overhead.","breath":"Slow, even breaths help maintain balance; a wobble usually means the breath sped up.","category":"Yoga","focus":"Balance, ankle stability, core","level":"Beginner","name":"Tree Pose","order":6,"progression":"","start":"Stand tall in Mountain Pose, weight shifted onto one foot."},{"id":"triangle-pose","adjusted":"Hinge at the front hip and reach front hand toward the shin or floor, extend the other arm straight up, open the chest toward the ceiling.","breath":"Exhale as you hinge and reach down; inhale to lengthen the spine.","category":"Yoga","focus":"Hamstrings, obliques, hips, side body stretch","level":"Beginner","name":"Triangle Pose","order":5,"progression":"","start":"Stand with feet wide, front foot pointed forward, back foot angled in slightly."},{"id":"tuck-sit","adjusted":"Press through the hands to lift the hips and tucked knees off the ground, holding the tuck in the air.","breath":"Steady breathing throughout the hold, avoid holding the breath.","category":"L-Sit Progression","focus":"Core compression, hip flexors, triceps","level":"Intermediate","name":"Tuck Sit","order":69,"progression":"Next: Single-Leg L-Sit","start":"Sit supported on the floor or parallettes, hands planted beside the hips, knees bent and drawn toward the chest."},{"id":"typewriter-pull-up","adjusted":"Shift the body side to side at the top of the pull, staying elevated, before lowering back down.","breath":"Exhale on the pull and shift, inhale lowering down.","category":"Pull-Up","focus":"Lats, biceps, shoulder stability","level":"Advanced","name":"Typewriter Pull-Up","order":68,"progression":"Top of the pull-up progression","start":"Pull up to the top of a wide-grip pull-up with the chin over the bar."},{"id":"typewriter-push-up","adjusted":"Lower into a wide push-up, then shift the body side to side at the bottom before pressing back up.","breath":"Inhale down, exhale as you shift and press up.","category":"Push-Up","focus":"Chest, triceps, shoulder stability","level":"Advanced","name":"Typewriter Push-Up","order":39,"progression":"Advanced skill variation, best attempted after Archer Push-Up is solid","start":"Plank position with hands set wide."},{"id":"upward-facing-dog","adjusted":"Press through hands to lift chest and thighs off the mat, only tops of feet touch down, shoulders pulled back and down.","breath":"Inhale as you press up and open the chest.","category":"Yoga","focus":"Spine extension, chest, shoulders, quads","level":"Beginner","name":"Upward-Facing Dog","order":2,"progression":"","start":"Lie face down, hands planted near lower ribs, tops of feet flat on the mat."},{"id":"v-sit","adjusted":"Raise the legs further up above hip height, forming a V shape between the torso and legs.","breath":"Steady breathing throughout, exhale to help maintain the deep core brace.","category":"L-Sit Progression","focus":"Core, hip flexors, deep compression","level":"Advanced","name":"V-Sit","order":72,"progression":"Top of the L-sit progression","start":"Support the body on hands or parallettes, legs extended in the full L-sit position."},{"id":"walking-lunge","adjusted":"Step forward into a lunge, then rather than returning, drive off the back foot to bring it forward into the next lunge, continuing to travel forward.","breath":"Exhale driving up out of each lunge, inhale stepping into the next.","category":"Lunge","focus":"Quads, glutes, hamstrings, coordination","level":"Beginner","name":"Walking Lunge","order":53,"progression":"Next: Jumping Lunge","start":"Stand tall with feet hip-width apart, in open space to move forward."},{"id":"wall-facing-handstand","adjusted":"Press through the hands to lengthen the body into a tight, straight vertical line, stacking shoulders over wrists and hips over shoulders.","breath":"Steady even breathing throughout the hold.","category":"Handstand","focus":"Shoulders, core, body-line control, balance","level":"Advanced","name":"Wall-Facing Handstand","order":94,"progression":"Next: Freestanding Handstand","start":"Face the wall, walk the feet up the wall and hands in until the body is inverted, chest close to the wall, arms extended."},{"id":"wall-handstand-hold","adjusted":"Engage the core and glutes to hold the body in a long straight hollow-body line, pressing firmly through the hands.","breath":"Steady even breathing throughout the hold, never holding the breath.","category":"Handstand","focus":"Shoulders, core, wrist and shoulder stability","level":"Intermediate","name":"Wall Handstand Hold","order":93,"progression":"Next: Wall-Facing Handstand","start":"Kick or walk up into a handstand with the back facing the wall, heels resting against the wall for support, arms fully extended, hands shoulder-width apart."},{"id":"wall-handstand-push-up","adjusted":"Bend the elbows to lower the head toward the floor between the hands, then press back up to full extension.","breath":"Inhale lowering down, exhale pressing up.","category":"Handstand","focus":"Shoulders, triceps, upper chest (vertical pressing strength)","level":"Advanced","name":"Wall Handstand Push-Up","order":96,"progression":"Next: Handstand Push-Up","start":"Hold a wall handstand with the back to the wall, arms fully extended, body in a tight line."},{"id":"wall-push-up","adjusted":"Bend the elbows to bring the chest toward the wall, then press back to straight arms without letting the hips sag.","breath":"Inhale toward the wall, exhale as you press away.","category":"Push-Up","focus":"Chest, shoulders, triceps (very light load)","level":"Beginner","name":"Wall Push-Up","order":200,"progression":"Very first push-up. Next: Incline Push-Up","start":"Stand an arm's length from a wall, hands on the wall at chest height, slightly wider than shoulders, body straight."},{"id":"wall-sit","adjusted":"Slide down the wall until the thighs are parallel to the floor and knees are at roughly 90 degrees, holding the position.","breath":"Steady even breathing throughout the hold, never holding the breath.","category":"Squat","focus":"Quads, isometric endurance","level":"Beginner","name":"Wall Sit","order":50,"progression":"Isometric intro; builds toward Air Squat","start":"Stand with the back against a wall, feet shoulder-width apart, out from the wall slightly."},{"id":"warrior-i","adjusted":"Bend front knee to roughly 90 degrees, reach both arms overhead, back leg straight and strong.","breath":"Inhale to lift arms overhead, breathe steadily while holding.","category":"Yoga","focus":"Hip flexors, quads, shoulders, balance","level":"Beginner","name":"Warrior I","order":3,"progression":"","start":"Stand with feet split front-to-back, back foot angled slightly out, hips facing forward."},{"id":"warrior-ii","adjusted":"Bend front knee over ankle, extend arms parallel to floor over each leg, gaze over front hand.","breath":"Steady even breathing, exhale to sink deeper into the front knee.","category":"Yoga","focus":"Quads, glutes, shoulders, hip mobility","level":"Beginner","name":"Warrior II","order":4,"progression":"","start":"Stand with feet wide, front foot forward, back foot turned out 90 degrees."},{"id":"wide-grip-pull-up","adjusted":"Pull the body up until the chin clears the bar, then lower back down with control.","breath":"Exhale pulling up, inhale lowering down.","category":"Pull-Up","focus":"Lats (wider emphasis), upper back","level":"Intermediate","name":"Wide-Grip Pull-Up","order":64,"progression":"Next: Commando Pull-Up","start":"Hang from a bar with an overhand grip, hands set wider than shoulder width, arms fully extended."},{"id":"wide-push-up","adjusted":"Bend the elbows out to the sides to lower the chest toward the floor, then press back up.","breath":"Inhale down, exhale up.","category":"Push-Up","focus":"Outer chest, shoulders","level":"Intermediate","name":"Wide Push-Up","order":35,"progression":"Chest-width branch; pairs with Diamond Push-Up for full range","start":"Plank position with hands placed wider than shoulder width."}],"workouts":[{"id":"academy-20x25-challenge","after":["muscle-up-day","one-arm-path","leg-endurance-test"],"branch":"Skill","duration":"20 min","level":"Advanced","name":"Academy 20x25 Challenge","order":654,"pinned":false,"structure":"1x standard pull-up/45s + 15s rest | 1x commando pull-up/45s + 15s rest | 1x standard push-up/45s + 15s rest | 1x diamond push-up/45s + 15s rest | 1x archer push-up/45s + 15s rest | 1x pike push-up/45s + 15s rest | 1x burpee/45s + 15s rest | 2x forward lunge/45s + 15s rest | 2x reverse lunge/45s + 15s rest | 2x lateral lunge/45s + 15s rest | 2x air squat/45s + 15s rest | 2x cossack squat/45s + 15s rest | 2x split squat/45s + 15s rest | 1x muscle-up/45s + 0s rest","tags":["challenge","full body","capstone"],"tier":10,"times":3},{"id":"academy-500","about":"The Academy capstone: 20 movements × 25 reps, 500 reps for time. Unlocks when you pass all 8 Unit Tests.","branch":"Skill","capSecs":3600,"duration":"47 min","goldSecs":2100,"kind":"test","level":"Advanced","name":"Academy 500","order":908,"reps":500,"structure":"1x standard pull-up/25 + 0s rest | 1x commando pull-up/25 + 0s rest | 1x standard push-up/25 + 0s rest | 1x diamond push-up/25 + 0s rest | 1x archer push-up/25 + 0s rest | 1x pike push-up/25 + 0s rest | 1x burpee/25 + 0s rest | 2x forward lunge/25 + 0s rest | 2x reverse lunge/25 + 0s rest | 2x lateral lunge/25 + 0s rest | 2x air squat/25 + 0s rest | 2x cossack squat/25 + 0s rest | 2x split squat/25 + 0s rest | 1x muscle-up/25 + 0s rest","tags":["test","for time","final"],"testOf":"final"},{"id":"advanced-push-pyramid","after":["archer-prep"],"branch":"Push","duration":"25 min","level":"Advanced","name":"Adv function parseStructure(str,keepReps){
  return String(str||"").split(" | ").map(p=>{
    const m=p.trim().match(/^(\d+)x\s+(.+?)\/([^+]+?)\s*\+\s*(\d+)s rest$/i);

    let s={rounds:+m[1],name:m[2],amt:m[3].trim(),rest:+m[4]};

/* skill tree drawn as a real graph: tiers top to bottom, edges from each prerequisite to its unlock */
function graph(ws){
  if(!ws.length) return "";
  const ids=new Set(ws.map(w=>w.id)),Y={},COL={};
  const tiers=[...new Set(ws.map(w=>w.tier||1))].sort((a,b)=>a-b);
  const cols=tiers.map(t=>ws.filter(w=>(w.tier||1)===t));
  const maxCol=Math.max(...cols.map(c=>c.length));
  const CW=150,RH=150,PADX=66,PADY=14,R=33,H=maxCol*RH,W=PADX*2+(cols.length-1)*CW;
  const bary=w=>{const ps=(w.after||[]).filter(id=>ids.has(id)&&Y[id]!=null);return ps.length?ps.reduce((s,id)=>s+Y[id],0)/ps.length:H/2};
  cols.forEach((col,ci)=>{if(ci)col.sort((a,b)=>bary(a)-bary(b));col.forEach((w,i)=>{Y[w.id]=(i+.5)/col.length*H;COL[w.id]=ci})});
  const cx=w=>PADX+COL[w]*CW, cy=id=>Y[id];
  const edges=[];
  ws.forEach(w=>(w.after||[]).filter(id=>ids.has(id)).forEach(pid=>{
    const met=(CNT[pid]||0)>=needOf(w),avail=UNL.has(pid);
    const x1=cx(pid)+R+4,y1=cy(pid)-PADY,x2=cx(w.id)-R-6,y2=cy(w.id)-PADY,mx=(x2-x1)*.5;
    edges.push(`<path class="edge ${met?"on":avail?"part":"off"}" d="M${x1} ${y1} C${x1+mx} ${y1} ${x2-mx} ${y2} ${x2} ${y2}"/>`);
  }));
  const nodes=ws.map(w=>{
    const un=isUnlocked(w),n=CNT[w.id]||0,kids=children(w.id),nxt=kids.length?Math.max(...kids.map(needOf)):5;
    /* Ready → Completed (1–9×) → Mastered (10×) → Too Easy (25×) */
    const state=!un?"locked":n===0?"new":n>=25?"easy":n>=10?"mastered":"open";
    const goal=n<nxt&&kids.length?nxt:n<10?10:25;
    const prog=!un?0:state==="easy"?100:Math.min(100,n/goal*100);
    const inner={locked:LOCK_SVG,new:"GO",open:`${n}×`,mastered:"★",easy:`${n}×`}[state];
    const outside=(w.after||[]).filter(id=>!ids.has(id));
    const meta=!un?reqs(w).filter(r=>r.have<r.need).map(r=>`${esc(r.name)} ${r.have}/${r.need}`).join(" · ")
      :state==="new"?`${esc(w.duration)} · ${wXP(w)} XP`:state==="easy"?`Too Easy · ${n}×`:state==="mastered"?`Mastered · ${n}×`:`Completed ${n}× · ${goal===nxt?`${n}/${nxt} to unlock next`:`${n}/10 to master`}`;
    return `<button class="tnode ${state}" style="left:${cx(w.id)}px;top:${cy(w.id)-PADY-R}px" data-open-workout="${esc(w.id)}" aria-label="${esc(w.name)}, ${{locked:"locked",new:"ready",open:`completed ${n} times`,mastered:`mastered, ${n} times`,easy:`too easy, ${n} times`}[state]}">
