function seeded(seed){let x=2166136261;for(const c of String(seed)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)>>>0}return ()=>{x=Math.imul(x^(x>>>15),2246822507)>>>0;x=Math.imul(x^(x>>>13),3266489909)>>>0;return ((x^=x>>>16)>>>0)/4294967296}}
const daysAgo=iso=>{const [y,m,d]=iso.split("-").map(Number);const [ty,tm,td]=todayISO().split("-").map(Number);return Math.round((new Date(ty,tm-1,td)-new Date(y,m-1,d))/864e5)};
function homePicks(){
  const rnd=seeded(todayISO()+"|"+S.homeShuffle+"|"+S.uid);
  const pickOne=arr=>arr.length?arr[Math.floor(rnd()*arr.length)]:null;
  const avail=S.workouts.filter(w=>w.branch&&w.branch!=="Custom"&&isUnlocked(w));
  const out=[],used=new Set(),add=(w,why,kind,extra)=>{if(w&&!used.has(w.id)){used.add(w.id);out.push({w,why,kind,...extra})}};
  /* 1. a unit test that's ready and not yet passed */
  const t=(S.tests||[]).find(x=>isUnlocked(x)&&!PASS.has(x.id));
  if(t)add(t,BEST[t.id]?`Retake it: beat ${clock(t.capSecs)} to pass`:`You finished the ${t.testOf==="final"?"tree":t.testOf+" branch"}. Time to prove it.`,"test");
  /* 2. the fastest way to the next unlock */
  const steps=[];nearest(4).forEach(target=>reqs(target).forEach(r=>{const w=WMAP[r.id];if(w&&isUnlocked(w)&&r.have<r.need)steps.push({w,left:r.need-r.have,target})}));
  steps.sort((a,b)=>a.left-b.left);
  const st=steps.filter(x=>x.left===(steps[0]||{}).left);const s1=pickOne(st);
  if(s1)add(s1.w,`${s1.left} more ${s1.left===1?"completion unlocks":"completions unlock"} ${s1.target.name}`,"unlock");
  /* 3. balance: the branch you've neglected longest */
  const last={};S.logs.forEach(l=>{const b=(WMAP[l.workoutId]||{}).branch||l.branch;if(b&&(!last[b]||l.date>last[b]))last[b]=l.date});
  const brs=BRANCHES.map(([b])=>b).filter(b=>avail.some(w=>w.branch===b&&!used.has(w.id)));
  brs.sort((a,b)=>(last[a]||"0")<(last[b]||"0")?-1:(last[a]||"0")>(last[b]||"0")?1:rnd()-.5);
  const bb=brs[0];
  if(bb){const cand=avail.filter(w=>w.branch===bb&&!used.has(w.id)).sort((a,b)=>(CNT[a.id]||0)-(CNT[b.id]||0));const low=cand.filter(w=>(CNT[w.id]||0)===(CNT[cand[0].id]||0));
    add(pickOne(low),last[bb]?`Balance: no ${bb} in ${daysAgo(last[bb])} day${daysAgo(last[bb])===1?"":"s"}`:`Balance: try the ${bb} branch`,"balance")}
  /* 4. something new (first completion bonus) or a quick one */
  const fresh=avail.filter(w=>!CNT[w.id]&&!used.has(w.id));
  if(fresh.length)add(pickOne(fresh),`New for you · +${XPC.first} XP first-time bonus`,"new");
  else{const quick=avail.filter(w=>!used.has(w.id)&&(parseInt(w.duration)||99)<=15);add(pickOne(quick),"Short on time? A quick one","quick")}
  return out.slice(0,4);
}

  const mins=w=>parseInt(w.duration)||0, done=w=>CNT[w.id]||0;

    time:(a,b)=>mins(a)-mins(b)||a.name.localeCompare(b.name),

    ${wThumb(w,{badge:!un?LOCK_SVG:isPinned(w)?PIN_SVG:""})}
    <div class="main"><h3>${esc(w.name)}</h3><div class="sub">${esc(bOf(w))}${w.track?" · "+esc(w.track):""} · ${esc(w.level)}</div>${line}</div>

const TRASH_SVG=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`;
/* XP a single session is worth right now: total XP with it minus total XP without it (includes unlocks and badges it earned) */
function logXP(id){
  const keep=S.logs,full=XP;S.logs=keep.filter(l=>l.id!==id);
  try{recalc();return Math.max(0,full-XP)}finally{S.logs=keep;recalc()}
}

    :`<div class="empty"><h3>No sessions yet</h3>Every entry here feeds next week's plan. Effort and notes tell Claude when to progress a movement or hold it.</div>`;

  }

/* ---------- stats ---------- */
function wStats(id){
  const ls=S.logs.filter(l=>l.workoutId===id);const n=ls.length;
  const avg=n?ls.reduce((a,l)=>a+(+l.effort||0),0)/n:null;
  return {n,avg,last:ls[0],recent:ls.slice(0,12).reverse()};
}
function sparkline(ls){
  if(!ls.length) return "";

    <div class="spark-cap"><span>${esc(fmtDate(ls[0].date))}</span><span>Effort, oldest → latest</span><span>${esc(fmtDate(ls[ls.length-1].date))}</span></div>`;
}
function statsPanel(id){

      <div class="stat"><b style="font-size:1.05rem;padding-block:.22rem">${esc(fmtDate(st.last.date))}</b><span>Last done</span></div></div>

}
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

function gotoPhase(n){

function tickRun(){

  if(!p.secs){const s=$("#runSet");if(s)s.textContent=clock(setElapsed());return}

  const n=Math.ceil(left);updProg(left,p);
  if(PREF.tHalf==="on"&&p.kind==="work"&&p.secs>=20&&!R.half&&left<=p.secs/2&&left>3){R.half=true;cue("half");if(PREF.tVoice==="full")say("Halfway")}

/* local fallback store: same calls as the cloud db, saved in this browser */
function LocalDB(){
  const KEY="cac-local-db";let store={};try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(_){}
  const subs=new Set(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(_){}},fire=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const merge=(a,b)=>{const o={...(a||{})};for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?merge(o[k],b[k]):b[k]}return o};
  const clone=d=>JSON.parse(JSON.stringify(d));
  const docRef=path=>({id:path.split("/").pop(),collection:n=>colRef(path+"/"+n),
    async set(d){store[path]=clone(d);save();fire()},
    async update(d){if(!store[path])throw {code:"not_found"};store[path]=merge(store[path],clone(d));save();fire()},
    async delete(){delete store[path];Object.keys(store).forEach(k=>{if(k.startsWith(path+"/"))delete store[k]});save();fire()},
    onSnapshot(cb){const f=()=>cb({id:path.split("/").pop(),exists:path in store,data:()=>store[path]});subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)}});
  const colRef=(path,ord,lim)=>({doc:id=>docRef(path+"/"+id),
    async add(d){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await docRef(path+"/"+id).set(d);return {id}},
    orderBy:(f,dir)=>colRef(path,[f,dir],lim),limit:n=>colRef(path,ord,n),
    onSnapshot(cb){const pre=path+"/";const f=()=>{let docs=Object.keys(store).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(k=>({id:k.slice(pre.length),data:()=>store[k]}));
      if(ord)docs.sort((a,b)=>{const x=String(a.data()[ord[0]]??""),y=String(b.data()[ord[0]]??"");return (ord[1]==="desc"?-1:1)*x.localeCompare(y)});if(lim)docs=docs.slice(0,lim);cb({docs})};subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)}});
  return {doc:docRef,collection:colRef,local:true};
}
/* the full library ships inside the page, so everyone sees every workout and movement even before (or without) the shared database */
let SEED={movements:[],workouts:[]};try{SEED=JSON.parse(document.getElementById("seed").textContent)}catch(_){}
(async()=>{
  const sort=(a,b)=>a.name.localeCompare(b.name),byOrder=arr=>arr.slice().sort((a,b)=>(a.order??999)-(b.order??999)||sort(a,b));
  S.movements=byOrder(SEED.movements);S.library=byOrder(SEED.workouts);mergeWorkouts();S.wLoaded=true;
  let db=null,uid=null;
  if(window.CAC_AUTH){/* iPhone app: Firebase account (email + password) stands in for Claude's db and user */
    try{const a=await window.CAC_AUTH();if(a){db=a.db;USER=a.user;uid=a.uid;document.documentElement.classList.add("signed-in")}}catch(_){db=null;USER=null;uid=null}
  }else{
  try{db=await window.claude?.use?.("db")}catch(_){db=null}
  try{USER=await window.claude?.use?.("user");uid=USER&&USER.id?await USER.id().catch(()=>null):null}catch(_){USER=null}
  }
  let canW=!!(db&&uid);
  if(canW){try{const c=USER.can&&await USER.can("data.write");if(c===false)canW=false}catch(_){}}
  S.db=db||null;S.uid=uid||"local";S.pdb=canW?db:LocalDB();S.local=!!S.pdb.local;
  if(USER&&uid){try{S.isAdmin=!!(USER.isOwner&&await USER.isOwner())}catch(_){}}
  let pending=5;const settle=()=>{if(--pending<=0&&!S.ready){S.ready=true}render()};
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},4000);
  const onErr=()=>toast("Live updates paused. Your library is still here; reopen the page to reconnect.");
  if(db){
    /* the shared database wins when it has data; an empty or unreachable one leaves the bundled library in place */
    db.collection("movements").onSnapshot(s=>{if(s.docs.length)S.movements=byOrder(s.docs.map(d=>({id:d.id,...d.data()})));settle()},()=>{settle()});
    db.collection("workouts").onSnapshot(s=>{if(s.docs.length){S.library=byOrder(s.docs.map(d=>({id:d.id,...d.data()})));mergeWorkouts()}settle()},()=>{settle()});
    db.collection("groups").onSnapshot(s=>{S.groups=s.docs.map(d=>({id:d.id,...d.data()}));syncEventSubs();settle();setTimeout(checkInviteHash,300)},()=>{S.groups=[];settle()});
    db.collection("athletes").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.athletes=m;if(S.tab==="groups"||S.sheetCtx)render();if(S.sheetCtx&&["group","member"].includes(S.sheetCtx.type))refreshSheet()},()=>{});
  }else{settle();settle();S.groups=[];settle()}
  myWRef().onSnapshot(s=>{S.custom=s.docs.map(d=>({id:d.id,...d.data()})).sort(sort);mergeWorkouts();render()},onErr);
  profileRef().onSnapshot(s=>{S.profile=s.exists?{...s.data()}:{};S.plan=S.profile.plan||null;settle()},onErr);
  logsRef().orderBy("date","desc").limit(1000).onSnapshot(s=>{
    const before=S.wLoaded&&S.lLoaded?new Set(UNL):null;
    S.logs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)));
    const xpBefore=XP,lvBefore=LV.L,earnedBefore=new Set(EARNED),recBefore={...FACTS};
    if(before&&S.importing){recalc()}
    else if(before){recalc();const fresh=[...UNL].filter(id=>!before.has(id));if(fresh.length)S.pendingUnlock=[...new Set([...(S.pendingUnlock||[]),...fresh])];
      if(XP>xpBefore){const prev=S.reward;const nb0=[...EARNED].filter(id=>!earnedBefore.has(id));
        const newest=S.logs.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
        S.reward={xp0:prev?prev.xp0:xpBefore,xp1:XP,lv0:prev?prev.lv0:levelOf(xpBefore),lv1:{...LV},
          badges:[...new Set([...(prev?prev.badges:[]),...nb0])],unlocks:[...new Set([...(prev?prev.unlocks:[]),...fresh])],
          log:newest,dbl:isDouble(todayISO()),first:newest&&S.logs.filter(l=>l.workoutId===newest.workoutId).length===1}}
      if(LV.L>lvBefore)S.pendingLevel=LV.L;
      const nb=[...EARNED].filter(id=>!earnedBefore.has(id));if(nb.length)S.pendingBadges=[...new Set([...(S.pendingBadges||[]),...nb])];
      const pr=[];if(FACTS.best>(recBefore.best||0)&&FACTS.best>1)pr.push("longest streak");if(FACTS.bestWeek&&recBefore.bestWeek!==undefined&&FACTS.bestWeek[1]>((recBefore.bestWeek||[0,0])[1])&&FACTS.bestWeek[1]>1)pr.push("best week");
      if(FACTS.farthest&&FACTS.farthest!==recBefore.farthest&&toMi(FACTS.farthest)>(recBefore.farthest?toMi(recBefore.farthest):0))pr.push("farthest cardio");
      if(pr.length)setTimeout(()=>toast(`New personal record: ${pr.join(", ")}!`),3200)}
    S.lLoaded=true;settle();publishCard()},onErr);
})();
